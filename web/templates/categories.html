{{define "content"}}
<h1>{{.T "categories"}}</h1>
<h2>{{.T "spending"}}</h2>
<table>{{range .Data.Expenses}}<tr><td class="indent{{.Depth}}">{{.Name}}</td></tr>{{end}}</table>
<h2>{{.T "income"}}</h2>
<table>{{range .Data.Income}}<tr><td class="indent{{.Depth}}">{{.Name}}</td></tr>{{end}}</table>
<h2>{{.T "categories.add"}}</h2>
<form class="grid" method="post" action="/categories">
  {{template "csrf" .}}
  <label for="name">{{.T "categories.name"}}</label><input id="name" name="name" required value="{{.Data.Form.name}}">
  <label for="in">{{.T "categories.in"}}</label><select id="in" name="in">
    <option value="">{{.T "categories.top"}}</option>
    {{range .Data.Expenses}}<option value="{{.Name}}" {{if eq .Name $.Data.Form.in}}selected{{end}}>{{.Name}}</option>{{end}}
  </select>
  <span class="hint">{{.T "categories.in.hint"}}</span>
  <label for="income">{{.T "categories.income"}}</label><input id="income" name="income" type="checkbox" value="1">
  <span></span><div><button>{{.T "save"}}</button></div>
</form>
{{end}}
